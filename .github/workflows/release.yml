name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:secrets

      - name: Verify tag matches package version
        run: |
          node -e "
            const p = require('./package.json');
            const expected = 'v' + p.version;
            if (process.env.GITHUB_REF_NAME !== expected) {
              console.error('tag ' + process.env.GITHUB_REF_NAME + ' != ' + expected);
              process.exit(1);
            }
          "

      - name: Pack tarball
        run: npm pack

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" source-i18n-*.tgz --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
